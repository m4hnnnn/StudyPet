[project]
name = "studypet"
version = "0.1.0"
description = "Virtual pet productivity tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "textual>=0.61.0",
    "pytest>=8.2.0",
    "pytest-anyio>=0.0.0",
    "anyio>=4.3.0",
]

[project.scripts]
studypet-server = "studypet.server:main"
studypet-cli    = "cli.cli:main"
studypet-tui    = "tui.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studypet", "cli", "tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
